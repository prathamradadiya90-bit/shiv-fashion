<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shreeji Fashion</title>
  </head>
  <body>
    <div id="root">
      <style>
        .initial-preloader {
          position: fixed;
          top: 0; left: 0; width: 100%; height: 100%;
          background: #ffffff;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 99999;
          font-family: 'Playfair Display', serif, sans-serif;
        }
        .initial-preloader-logo {
          font-size: 3.5rem;
          font-weight: bold;
          color: #D4AF37;
          animation: preloader-pulse 1.5s infinite ease-in-out;
        }
        .initial-preloader-text {
          margin-top: 12px;
          color: #8B3A3A;
          letter-spacing: 3px;
          font-size: 0.85rem;
          text-transform: uppercase;
          font-weight: 600;
        }
        @keyframes preloader-pulse {
          0% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.1); opacity: 0.7; }
          100% { transform: scale(1); opacity: 1; }
        }
      </style>
      <div class="initial-preloader">
        <div class="initial-preloader-logo">SH</div>
        <div class="initial-preloader-text">Shreeji Fashion</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
