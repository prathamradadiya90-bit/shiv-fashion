<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C45C" />
      <stop offset="50%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#9E7A18" />
    </linearGradient>
    <radialGradient id="velvetGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8F143D" />
      <stop offset="70%" stop-color="#72092C" />
      <stop offset="100%" stop-color="#3A0314" />
    </radialGradient>
  </defs>

  <!-- Background Circle with Velvet Gradient -->
  <circle cx="50" cy="50" r="48" fill="url(#velvetGrad)" />
  
  <!-- Outer Gold Ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Inner Delicate Beaded / Dotted Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#E5C45C" stroke-width="0.8" stroke-dasharray="1.5 2.5" opacity="0.8" />
  
  <!-- Stylized Lotus & Royal Lehenga Motif in Gold -->
  <g transform="translate(50, 48) scale(0.9)" fill="none" stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Traditional Floral Lotus Crown -->
    <path d="M0 -22 C-5 -12, -14 -6, -14 2 C-14 10, -6 13, 0 8 C6 13, 14 10, 14 2 C14 -6, 5 -12, 0 -22 Z" fill="url(#goldGrad)" fill-opacity="0.25" stroke-width="1.5" />
    <path d="M0 -18 C-3 -10, -8 -4, -8 2 C-8 6, -3 9, 0 6 C3 9, 8 6, 8 2 C8 -4, 3 -10, 0 -18 Z" fill="url(#goldGrad)" fill-opacity="0.9" stroke="none" />
    
    <!-- Flared Lehenga Hem Outline -->
    <path d="M-18 10 Q -10 14, 0 14 Q 10 14, 18 10 Q 24 24, 28 26 Q 0 32, -28 26 Q -24 24, -18 10 Z" fill="url(#goldGrad)" fill-opacity="0.3" stroke-width="1.4" />
    
    <!-- Zari pleats -->
    <line x1="0" y1="14" x2="0" y2="31" stroke="url(#goldGrad)" stroke-width="1.2" />
    <line x1="-9" y1="12" x2="-14" y2="28" stroke="url(#goldGrad)" stroke-width="1" />
    <line x1="9" y1="12" x2="14" y2="28" stroke="url(#goldGrad)" stroke-width="1" />
  </g>
  
  <!-- Brand Tagline Arc / Dots -->
  <circle cx="50" cy="85" r="2" fill="#E5C45C" />
  <circle cx="42" cy="85" r="1.2" fill="#C59B27" />
  <circle cx="58" cy="85" r="1.2" fill="#C59B27" />
</svg>